name: AI Workflow Gate

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  protected-ai-gate-files:
    name: Protected AI gate files
    runs-on: ubuntu-latest
    steps:
      - name: Classify protected AI gate file changes
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          mapfile -t changed_files < <(gh api --paginate "repos/${GH_REPO}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')

          protected_paths=(
            "scripts/ai_workflow_gate.py"
            "scripts/run_ai_job.ps1"
            ".githooks/pre-commit"
            ".github/workflows/ai-workflow-gate.yml"
            "tests/operations/test_ai_workflow_gate.py"
            "tests/operations/test_ai_workflow_execution_guards.py"
          )

          protected_changed=()
          outside_protected=()

          for changed in "${changed_files[@]}"; do
            is_protected=false
            for protected in "${protected_paths[@]}"; do
              if [[ "${changed}" == "${protected}" ]]; then
                protected_changed+=("${changed}")
                is_protected=true
                break
              fi
            done

            if [[ "${is_protected}" == "false" ]]; then
              outside_protected+=("${changed}")
            fi
          done

          if (( ${#protected_changed[@]} == 0 )); then
            echo "policy_update=false" >> "${GITHUB_OUTPUT}"
            echo "AI_WORKFLOW_REMOTE_GATE=PASS"
            exit 0
          fi

          if (( ${#outside_protected[@]} > 0 )); then
            echo "AI_WORKFLOW_REMOTE_GATE=REJECT"
            echo "Protected AI gate changes must not include non-protected files:"
            for changed in "${outside_protected[@]}"; do
              echo " - ${changed}"
            done
            exit 1
          fi

          echo "policy_update=true" >> "${GITHUB_OUTPUT}"
          echo "Protected AI gate policy change detected."

      - name: Checkout policy change
        if: steps.classify.outputs.policy_update == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Python
        if: steps.classify.outputs.policy_update == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install policy test dependency
        if: steps.classify.outputs.policy_update == 'true'
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run protected AI gate policy tests
        if: steps.classify.outputs.policy_update == 'true'
        env:
          GH_TOKEN: ''
        run: |
          python -m pytest             --confcutdir=tests/operations             tests/operations/test_ai_workflow_gate.py             tests/operations/test_ai_workflow_execution_guards.py             -q

      - name: Accept validated protected AI gate policy change
        if: steps.classify.outputs.policy_update == 'true'
        run: echo "AI_WORKFLOW_REMOTE_GATE=PASS"
