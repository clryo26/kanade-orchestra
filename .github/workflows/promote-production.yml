name: Promote Production

on:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: "Tested Git SHA to promote to production (do not use latest tag only)"
        required: true
        type: string
      tested_image_digest:
        description: "Digest currently confirmed in the test Cloud Run service"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  promote-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tested_sha }}

      - name: Validate required Variables/Secrets
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          ARTIFACT_REGISTRY_LOCATION: ${{ vars.ARTIFACT_REGISTRY_LOCATION }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
          ARTIFACT_REGISTRY_IMAGE: ${{ vars.ARTIFACT_REGISTRY_IMAGE }}
          TEST_CLOUD_RUN_SERVICE: ${{ vars.TEST_CLOUD_RUN_SERVICE }}
          PROD_CLOUD_RUN_SERVICE: ${{ vars.PROD_CLOUD_RUN_SERVICE }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}
          PROD_GCS_BUCKET: ${{ vars.PROD_GCS_BUCKET }}
        run: |
          set -euo pipefail
          missing=0
          for name in GCP_PROJECT_ID GCP_REGION ARTIFACT_REGISTRY_REPOSITORY ARTIFACT_REGISTRY_IMAGE TEST_CLOUD_RUN_SERVICE PROD_CLOUD_RUN_SERVICE WIF_PROVIDER DEPLOY_SERVICE_ACCOUNT PROD_GCS_BUCKET; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub Variable/Secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Authenticate to Google Cloud via OIDC/WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve currently deployed test image
        id: test_image
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          TEST_CLOUD_RUN_SERVICE: ${{ vars.TEST_CLOUD_RUN_SERVICE }}
          TESTED_IMAGE_DIGEST: ${{ inputs.tested_image_digest }}
        run: |
          set -euo pipefail
          CURRENT_IMAGE="$(gcloud run services describe "${TEST_CLOUD_RUN_SERVICE}" --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format='value(spec.template.spec.containers[0].image)')"
          if [ -z "${CURRENT_IMAGE}" ]; then
            echo "::error::Could not resolve current test Cloud Run image."
            exit 1
          fi
          CURRENT_DIGEST="${CURRENT_IMAGE##*@}"
          if [ "${CURRENT_DIGEST}" != "${TESTED_IMAGE_DIGEST}" ]; then
            echo "::error::Requested digest does not match current test Cloud Run image digest."
            exit 1
          fi
          echo "image_with_digest=${CURRENT_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Promote same digest to production Cloud Run
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          PROD_CLOUD_RUN_SERVICE: ${{ vars.PROD_CLOUD_RUN_SERVICE }}
          PROD_GCS_BUCKET: ${{ vars.PROD_GCS_BUCKET }}
          TESTED_SHA: ${{ inputs.tested_sha }}
          TESTED_IMAGE_DIGEST: ${{ inputs.tested_image_digest }}
          IMAGE_WITH_DIGEST: ${{ steps.test_image.outputs.image_with_digest }}
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          PROD_DB_HOST: ${{ secrets.PROD_DB_HOST }}
          PROD_DB_NAME: ${{ vars.PROD_DB_NAME }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
        run: |
          set -euo pipefail
          BUILD_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ENV_VARS="APP_ENV=production,DATA_BACKEND=db,LOCAL_JSON_FALLBACK_ENABLED=false,GIT_SHA=${TESTED_SHA},BUILD_TIMESTAMP=${BUILD_TIMESTAMP},IMAGE_URI=${IMAGE_WITH_DIGEST},IMAGE_DIGEST=${TESTED_IMAGE_DIGEST},GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID},GOOGLE_CLOUD_STORAGE_BUCKET=${PROD_GCS_BUCKET},CLOUD_RUN_SERVICE=${PROD_CLOUD_RUN_SERVICE}"

          if [ -n "${PROD_DB_URL:-}" ]; then
            ENV_VARS="${ENV_VARS},DB_URL=${PROD_DB_URL}"
          else
            for name in PROD_DB_HOST PROD_DB_NAME PROD_DB_USER; do
              if [ -z "${!name:-}" ]; then
                echo "::error::Set PROD_DB_URL or PROD_DB_HOST/PROD_DB_NAME/PROD_DB_USER."
                exit 1
              fi
            done
            ENV_VARS="${ENV_VARS},DB_HOST=${PROD_DB_HOST},DB_NAME=${PROD_DB_NAME},DB_USER=${PROD_DB_USER}"
          fi

          gcloud run deploy "${PROD_CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${IMAGE_WITH_DIGEST}" \
            --set-env-vars "${ENV_VARS}" \
            --update-secrets "DB_PASSWORD=kanade-portal-db-password:latest" \
            --quiet