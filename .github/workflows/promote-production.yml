name: Promote Production

on:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: "Tested Git SHA to promote to production (do not use latest tag only)"
        required: true
        type: string
      tested_image_digest:
        description: "Digest currently confirmed in the test Cloud Run service"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  promote-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tested_sha }}

      - name: Validate required Variables/Secrets
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          ARTIFACT_REGISTRY_LOCATION: ${{ vars.ARTIFACT_REGISTRY_LOCATION }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
          ARTIFACT_REGISTRY_IMAGE: ${{ vars.ARTIFACT_REGISTRY_IMAGE }}
          TEST_CLOUD_RUN_SERVICE: ${{ vars.TEST_CLOUD_RUN_SERVICE }}
          PROD_CLOUD_RUN_SERVICE: ${{ vars.PROD_CLOUD_RUN_SERVICE }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}
          PROD_GCS_BUCKET: ${{ vars.PROD_GCS_BUCKET }}
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          set -euo pipefail
          missing=0
          for name in GCP_PROJECT_ID GCP_REGION ARTIFACT_REGISTRY_REPOSITORY ARTIFACT_REGISTRY_IMAGE TEST_CLOUD_RUN_SERVICE PROD_CLOUD_RUN_SERVICE WIF_PROVIDER DEPLOY_SERVICE_ACCOUNT PROD_GCS_BUCKET PROD_DB_URL; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub Variable/Secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Authenticate to Google Cloud via OIDC/WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        shell: bash
        env:
          ARTIFACT_REGISTRY_LOCATION: ${{ vars.ARTIFACT_REGISTRY_LOCATION }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          GAR_LOCATION="${ARTIFACT_REGISTRY_LOCATION:-$GCP_REGION}"
          gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Resolve currently deployed test image
        id: test_image
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          TEST_CLOUD_RUN_SERVICE: ${{ vars.TEST_CLOUD_RUN_SERVICE }}
          TESTED_IMAGE_DIGEST: ${{ inputs.tested_image_digest }}
        run: |
          set -euo pipefail
          CURRENT_IMAGE="$(gcloud run services describe "${TEST_CLOUD_RUN_SERVICE}" --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format='value(spec.template.spec.containers[0].image)')"
          if [ -z "${CURRENT_IMAGE}" ]; then
            echo "::error::Could not resolve current test Cloud Run image."
            exit 1
          fi
          CURRENT_DIGEST="${CURRENT_IMAGE##*@}"
          if [ "${CURRENT_DIGEST}" != "${TESTED_IMAGE_DIGEST}" ]; then
            echo "::error::Requested digest does not match current test Cloud Run image digest."
            exit 1
          fi
          echo "image_with_digest=${CURRENT_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Apply DB migrations to production
        shell: bash
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          IMAGE_WITH_DIGEST: ${{ steps.test_image.outputs.image_with_digest }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e DB_URL="${PROD_DB_URL}" \
            -v "${GITHUB_WORKSPACE}/scripts:/app/scripts:ro" \
            "${IMAGE_WITH_DIGEST}" \
            .venv/bin/python scripts/migrate_db.py

      - name: Promote same digest to production Cloud Run
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          PROD_CLOUD_RUN_SERVICE: ${{ vars.PROD_CLOUD_RUN_SERVICE }}
          PROD_GCS_BUCKET: ${{ vars.PROD_GCS_BUCKET }}
          TESTED_SHA: ${{ inputs.tested_sha }}
          TESTED_IMAGE_DIGEST: ${{ inputs.tested_image_digest }}
          IMAGE_WITH_DIGEST: ${{ steps.test_image.outputs.image_with_digest }}
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          TEST_PORTAL_URL: ${{ vars.TEST_PORTAL_URL }}
        run: |
          set -euo pipefail
          BUILD_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ENV_VARS="APP_ENV=production,DATA_BACKEND=db,LOCAL_JSON_FALLBACK_ENABLED=false,GIT_SHA=${TESTED_SHA},BUILD_TIMESTAMP=${BUILD_TIMESTAMP},IMAGE_URI=${IMAGE_WITH_DIGEST},IMAGE_DIGEST=${TESTED_IMAGE_DIGEST},GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID},GOOGLE_CLOUD_STORAGE_BUCKET=${PROD_GCS_BUCKET},CLOUD_RUN_SERVICE=${PROD_CLOUD_RUN_SERVICE}"
          if [ -n "${TEST_PORTAL_URL:-}" ]; then
            ENV_VARS="${ENV_VARS},OTHER_ENVIRONMENT_URL=${TEST_PORTAL_URL}"
          fi

          ENV_VARS="${ENV_VARS},DB_URL=${PROD_DB_URL}"

          gcloud run deploy "${PROD_CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${IMAGE_WITH_DIGEST}" \
            --set-env-vars "${ENV_VARS}" \
            --quiet

      - name: Promote latest production revision to 100% traffic
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          PROD_CLOUD_RUN_SERVICE: ${{ vars.PROD_CLOUD_RUN_SERVICE }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${PROD_CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --to-latest \
            --quiet

          service_json="$(gcloud run services describe "${PROD_CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"
          export SERVICE_JSON="${service_json}"
          python - <<'PY'
          import json
          import os
          import sys

          service = json.loads(os.environ["SERVICE_JSON"])
          status = service.get("status", {})
          latest_ready_revision = status.get("latestReadyRevisionName")
          traffic = status.get("traffic", [])

          if not latest_ready_revision:
              sys.exit("latestReadyRevisionName is missing after production promotion")

          positive_traffic = [
              entry for entry in traffic
              if int(entry.get("percent") or 0) > 0
          ]
          if len(positive_traffic) != 1:
              sys.exit("Production traffic is not concentrated into a single positive-percent revision")

          traffic_entry = positive_traffic[0]
          if traffic_entry.get("revisionName") != latest_ready_revision:
              sys.exit("Production traffic revision does not match latestReadyRevisionName")
          if traffic_entry.get("percent") != 100:
              sys.exit("Production traffic is not 100% assigned to the latest ready revision")
          PY
