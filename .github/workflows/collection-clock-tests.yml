name: Isolated collection clock tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18']
    services:
      database:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: perf_stage3a
          POSTGRES_DB: portal_perf_stage3a
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perf_stage3a -d portal_perf_stage3a"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UV_SYSTEM_CERTS: 'true'
      PORTAL_PERF_STAGE3_DB_URL: postgresql://perf_stage3a@127.0.0.1:5432/portal_perf_stage3a
      PORTAL_PERF_STAGE3_REPORT: docs/perf_stage3/ci_comparison.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked --extra dev
      - run: uv run python scripts/generate_collection_clock_migration.py --check
      - run: >-
          uv run pytest -q tests/backend/test_perf_stage3_context.py
          tests/backend/test_perf_stage3_postgres.py tests/backend/test_perf_stage3_measurements.py
          tests/scripts/test_collection_clock_operations.py
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-clock-postgres-${{ matrix.postgres }}
          path: docs/perf_stage3/ci_comparison_scale*.json
          if-no-files-found: error
