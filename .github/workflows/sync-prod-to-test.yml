name: Sync Prod to Test (Template)
run-name: prod-to-test-sync-${{ inputs.operation_id }}

on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: "Production operation history id"
        required: true
        type: string
      target_git_sha:
        description: "Source Git SHA for sync metadata"
        required: true
        type: string
      dry_run:
        description: "Validate only without DB/GCS writes"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write

jobs:
  sync-prod-to-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_git_sha }}

      - name: Validate required Variables/Secrets
        if: ${{ inputs.dry_run != 'true' }}
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
          DB_NAME_PROD: ${{ vars.PROD_DB_NAME }}
          DB_NAME_TEST: ${{ vars.TEST_DB_NAME }}
          GCS_BUCKET_PROD: ${{ vars.PROD_GCS_BUCKET }}
          GCS_BUCKET_TEST: ${{ vars.TEST_GCS_BUCKET }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          TEST_DB_USER: ${{ secrets.TEST_DB_USER }}
        run: |
          set -euo pipefail
          missing=0
          for name in GCP_PROJECT_ID GCP_REGION CLOUD_SQL_INSTANCE DB_NAME_PROD DB_NAME_TEST GCS_BUCKET_PROD GCS_BUCKET_TEST WIF_PROVIDER DEPLOY_SERVICE_ACCOUNT PROD_DB_USER TEST_DB_USER; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub Variable/Secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Authenticate to Google Cloud via OIDC/WIF
        if: ${{ inputs.dry_run != 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud SDK
        if: ${{ inputs.dry_run != 'true' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Run prod-to-test preflight
        if: ${{ inputs.dry_run != 'true' }}
        shell: bash
        env:
          OPERATION_ID: ${{ inputs.operation_id }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
          DB_NAME_PROD: ${{ vars.PROD_DB_NAME }}
          DB_NAME_TEST: ${{ vars.TEST_DB_NAME }}
          GCS_BUCKET_PROD: ${{ vars.PROD_GCS_BUCKET }}
          GCS_BUCKET_TEST: ${{ vars.TEST_GCS_BUCKET }}
        run: |
          set -euo pipefail
          python scripts/sync_prod_to_test_preflight.py

      - name: Verify GCP resources for prod-to-test sync
        if: ${{ inputs.dry_run != 'true' }}
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
          GCS_BUCKET_PROD: ${{ vars.PROD_GCS_BUCKET }}
          GCS_BUCKET_TEST: ${{ vars.TEST_GCS_BUCKET }}
        run: |
          set -euo pipefail
          gcloud sql instances describe "${CLOUD_SQL_INSTANCE}" --project "${GCP_PROJECT_ID}"
          gcloud storage buckets describe "gs://${GCS_BUCKET_PROD}"
          gcloud storage buckets describe "gs://${GCS_BUCKET_TEST}"

      - name: Setup Python for database connection verification
        if: ${{ inputs.dry_run != 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install database verification dependency
        if: ${{ inputs.dry_run != 'true' }}
        shell: bash
        run: python -m pip install "psycopg[binary]==3.2.9"

      - name: Download Cloud SQL Auth Proxy
        if: ${{ inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.2/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

      - name: Verify prod and test database read-only connections
        if: ${{ inputs.dry_run != 'true' }}
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME_PROD: ${{ vars.PROD_DB_NAME }}
          DB_NAME_TEST: ${{ vars.TEST_DB_NAME }}
          DB_USER_PROD: ${{ secrets.PROD_DB_USER }}
          DB_USER_TEST: ${{ secrets.TEST_DB_USER }}
          DB_CONNECT_TIMEOUT: "10"
        run: |
          set -euo pipefail
          proxy_log="${RUNNER_TEMP}/cloud-sql-proxy.log"
          ./cloud-sql-proxy \
            --address 127.0.0.1 \
            --port 5432 \
            "${GCP_PROJECT_ID}:${GCP_REGION}:${CLOUD_SQL_INSTANCE}" \
            >"${proxy_log}" 2>&1 &
          proxy_pid=$!

          cleanup_proxy() {
            kill "${proxy_pid}" 2>/dev/null || true
            wait "${proxy_pid}" 2>/dev/null || true
          }
          trap cleanup_proxy EXIT

          proxy_ready=false
          for _ in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null; then
              proxy_ready=true
              break
            fi
            if ! kill -0 "${proxy_pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "${proxy_ready}" != "true" ]; then
            echo "::error::Cloud SQL Auth Proxy did not become ready"
            sed -e 's/^/[cloud-sql-proxy] /' "${proxy_log}"
            exit 1
          fi

          DB_PASSWORD="$(gcloud secrets versions access latest --secret=kanade-portal-db-password --project "${GCP_PROJECT_ID}")"
          if [ -z "${DB_PASSWORD}" ]; then
            echo "::error::Database password secret is empty"
            exit 1
          fi
          echo "::add-mask::${DB_PASSWORD}"
          export DB_PASSWORD
          python scripts/verify_prod_test_db_connections.py

      - name: Sync direction policy note
        shell: bash
        run: |
          echo "operation_id=${{ inputs.operation_id }}"
          echo "target_git_sha=${{ inputs.target_git_sha }}"
          echo "dry_run=${{ inputs.dry_run }}"
          echo "Allowed direction only: production -> test"
          echo "Reverse sync (test -> production) must not be implemented."

      - name: Template guard (no real sync in this phase)
        shell: bash
        run: |
          echo "This workflow is a template for prod-to-test sync preparation."
          echo "workflow_dispatch wiring is enabled, but DB/GCS sync remains disabled."
          echo "Real Cloud SQL/GCS sync command is intentionally disabled in this phase."
          exit 1
