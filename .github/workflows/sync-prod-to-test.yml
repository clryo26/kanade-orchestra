name: Sync Prod to Test (Template)
run-name: prod-to-test-sync-${{ inputs.operation_id }}

on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: "Production operation history id"
        required: true
        type: string
      target_git_sha:
        description: "Source Git SHA for sync metadata"
        required: true
        type: string
      dry_run:
        description: "Validate only without DB/GCS writes"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      sync_scope:
        description: "Execution scope (gcs_only resumes after a completed DB sync)"
        required: true
        default: "full"
        type: choice
        options:
          - "full"
          - "gcs_only"
      expected_test_revision:
        description: "Exact current ready test revision (maintenance revision for gcs_only)"
        required: false
        type: string
      maintenance_confirmation:
        description: "Type kanade-orchestra/asia-northeast2/kanade-orchestra-test when dry_run=false"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: kanade-orchestra-test-maintenance
  cancel-in-progress: false

jobs:
  sync-prod-to-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}

      - name: Validate required Variables/Secrets
        if: ${{ inputs.dry_run != 'true' }}
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          TEST_CLOUD_RUN_SERVICE: ${{ vars.TEST_CLOUD_RUN_SERVICE }}
          DB_NAME_PROD: ${{ vars.PROD_DB_NAME }}
          DB_NAME_TEST: ${{ vars.TEST_DB_NAME }}
          GCS_BUCKET_PROD: ${{ vars.PROD_GCS_BUCKET }}
          GCS_BUCKET_TEST: ${{ vars.TEST_GCS_BUCKET }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}
          PROD_DB_DIRECT_URL: ${{ secrets.PROD_DB_DIRECT_URL }}
          TEST_DB_DIRECT_URL: ${{ secrets.TEST_DB_DIRECT_URL }}
          EXPECTED_TEST_REVISION: ${{ inputs.expected_test_revision }}
          MAINTENANCE_CONFIRMATION: ${{ inputs.maintenance_confirmation }}
        run: |
          set -euo pipefail
          missing=0
          for name in GCP_PROJECT_ID GCP_REGION TEST_CLOUD_RUN_SERVICE DB_NAME_PROD DB_NAME_TEST GCS_BUCKET_PROD GCS_BUCKET_TEST WIF_PROVIDER DEPLOY_SERVICE_ACCOUNT PROD_DB_DIRECT_URL TEST_DB_DIRECT_URL EXPECTED_TEST_REVISION MAINTENANCE_CONFIRMATION; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub Variable/Secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if [ "${GCP_PROJECT_ID}" != "kanade-orchestra" ]; then
            echo "::error::Prod-to-test sync is restricted to project kanade-orchestra."
            exit 1
          fi
          if [ "${GCP_REGION}" != "asia-northeast2" ]; then
            echo "::error::Prod-to-test sync is restricted to region asia-northeast2."
            exit 1
          fi
          if [ "${TEST_CLOUD_RUN_SERVICE}" != "kanade-orchestra-test" ]; then
            echo "::error::Prod-to-test sync is restricted to service kanade-orchestra-test."
            exit 1
          fi
          if [ "${MAINTENANCE_CONFIRMATION}" != "kanade-orchestra/asia-northeast2/kanade-orchestra-test" ]; then
            echo "::error::Maintenance confirmation does not exactly match the test target."
            exit 1
          fi

      - name: Authenticate to Google Cloud via OIDC/WIF
        if: ${{ inputs.dry_run != 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud SDK
        if: ${{ inputs.dry_run != 'true' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Run prod-to-test preflight
        if: ${{ inputs.dry_run != 'true' }}
        shell: bash
        env:
          OPERATION_ID: ${{ inputs.operation_id }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          PROD_DB_DIRECT_URL: ${{ secrets.PROD_DB_DIRECT_URL }}
          TEST_DB_DIRECT_URL: ${{ secrets.TEST_DB_DIRECT_URL }}
          DB_NAME_PROD: ${{ vars.PROD_DB_NAME }}
          DB_NAME_TEST: ${{ vars.TEST_DB_NAME }}
          GCS_BUCKET_PROD: ${{ vars.PROD_GCS_BUCKET }}
          GCS_BUCKET_TEST: ${{ vars.TEST_GCS_BUCKET }}
        run: |
          set -euo pipefail
          python scripts/sync_prod_to_test_preflight.py

      - name: Verify GCP resources for prod-to-test sync
        if: ${{ inputs.dry_run != 'true' }}
        shell: bash
        env:
          GCS_BUCKET_PROD: ${{ vars.PROD_GCS_BUCKET }}
          GCS_BUCKET_TEST: ${{ vars.TEST_GCS_BUCKET }}
        run: |
          set -euo pipefail
          gcloud storage buckets describe "gs://${GCS_BUCKET_PROD}"
          gcloud storage buckets describe "gs://${GCS_BUCKET_TEST}"

      - name: Setup Python for database connection verification
        if: ${{ inputs.dry_run != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install database verification and backup dependencies
        if: ${{ inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "psycopg[binary]==3.2.9" \
            "google-cloud-storage==2.14.0"

      - name: Install PostgreSQL 18 client from official PGDG repository
        if: ${{ inputs.dry_run == 'false' && inputs.sync_scope == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl gnupg

          key_file="${RUNNER_TEMP}/postgresql-pgdg.asc"
          keyring_file="${RUNNER_TEMP}/postgresql-pgdg.gpg"
          curl --fail --location --silent --show-error \
            --output "${key_file}" \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          fingerprint="$(gpg --batch --show-keys --with-colons "${key_file}" | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [ "${fingerprint}" != "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8" ]; then
            echo "::error::Unexpected PostgreSQL PGDG signing key fingerprint"
            exit 1
          fi
          gpg --batch --yes --dearmor --output "${keyring_file}" "${key_file}"
          sudo install -m 0644 "${keyring_file}" /usr/share/keyrings/postgresql-pgdg.gpg

          . /etc/os-release
          if [ -z "${VERSION_CODENAME:-}" ]; then
            echo "::error::Ubuntu VERSION_CODENAME is unavailable"
            exit 1
          fi
          echo "deb [signed-by=/usr/share/keyrings/postgresql-pgdg.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/postgresql-pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-18

          if [ ! -x "/usr/lib/postgresql/18/bin/pg_dump" ]; then
            echo "::error::PostgreSQL 18 dump executable is unavailable"
            exit 1
          fi
          if [ ! -x "/usr/lib/postgresql/18/bin/pg_restore" ]; then
            echo "::error::PostgreSQL 18 restore executable is unavailable"
            exit 1
          fi
          dump_version="$(/usr/lib/postgresql/18/bin/pg_dump --version)"
          restore_version="$(/usr/lib/postgresql/18/bin/pg_restore --version)"
          case "${dump_version}" in
            "pg_dump (PostgreSQL) 18"|"pg_dump (PostgreSQL) 18."*) ;;
            *) echo "::error::PostgreSQL dump client major version is not 18"; exit 1 ;;
          esac
          case "${restore_version}" in
            "pg_restore (PostgreSQL) 18"|"pg_restore (PostgreSQL) 18."*) ;;
            *) echo "::error::PostgreSQL restore client major version is not 18"; exit 1 ;;
          esac

      - name: Verify prod and test database read-only connections
        if: ${{ inputs.dry_run != 'true' && inputs.sync_scope == 'full' }}
        shell: bash
        env:
          PROD_DB_DIRECT_URL: ${{ secrets.PROD_DB_DIRECT_URL }}
          TEST_DB_DIRECT_URL: ${{ secrets.TEST_DB_DIRECT_URL }}
          DB_NAME_PROD: ${{ vars.PROD_DB_NAME }}
          DB_NAME_TEST: ${{ vars.TEST_DB_NAME }}
          DB_CONNECT_TIMEOUT: "10"
        run: |
          set -euo pipefail
          python scripts/verify_prod_test_db_connections.py

      - name: Run test pre-sync backup
        if: ${{ inputs.dry_run == 'false' && inputs.sync_scope == 'full' }}
        shell: bash
        env:
          OPERATION_ID: ${{ inputs.operation_id }}
          TARGET_GIT_SHA: ${{ inputs.target_git_sha }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          TEST_DB_DIRECT_URL: ${{ secrets.TEST_DB_DIRECT_URL }}
          DB_NAME_TEST: ${{ vars.TEST_DB_NAME }}
          GCS_BUCKET_TEST: ${{ vars.TEST_GCS_BUCKET }}
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/18/bin:${PATH}"
          resolved_pg_dump="$(command -v pg_dump)"
          resolved_pg_restore="$(command -v pg_restore)"
          if [ "${resolved_pg_dump}" != "/usr/lib/postgresql/18/bin/pg_dump" ]; then
            echo "::error::Dump executable did not resolve to the PostgreSQL 18 client"
            exit 1
          fi
          if [ "${resolved_pg_restore}" != "/usr/lib/postgresql/18/bin/pg_restore" ]; then
            echo "::error::Restore executable did not resolve to the PostgreSQL 18 client"
            exit 1
          fi
          python scripts/backup_test_environment_pre_sync.py --execute

      - name: Validate test pre-sync backup manifest
        if: ${{ inputs.dry_run == 'false' && inputs.sync_scope == 'full' }}
        shell: bash
        env:
          OPERATION_ID: ${{ inputs.operation_id }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DB_NAME_PROD: ${{ vars.PROD_DB_NAME }}
          DB_NAME_TEST: ${{ vars.TEST_DB_NAME }}
          GCS_BUCKET_PROD: ${{ vars.PROD_GCS_BUCKET }}
          GCS_BUCKET_TEST: ${{ vars.TEST_GCS_BUCKET }}
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/18/bin:${PATH}"
          python scripts/check_backup_manifest.py

      - name: Enable test maintenance and drain requests
        id: enable_maintenance
        if: ${{ inputs.dry_run == 'false' && inputs.sync_scope == 'full' }}
        shell: bash
        env:
          EXPECTED_TEST_REVISION: ${{ inputs.expected_test_revision }}
          MAINTENANCE_CONFIRMATION: ${{ inputs.maintenance_confirmation }}
        run: |
          set -euo pipefail
          maintenance_output="$(python scripts/manage_test_maintenance.py enable \
            --project "kanade-orchestra" \
            --region "asia-northeast2" \
            --service "kanade-orchestra-test" \
            --confirmation "${MAINTENANCE_CONFIRMATION}" \
            --expected-revision "${EXPECTED_TEST_REVISION}" \
            --execute)"
          maintenance_revision="${maintenance_output#maintenance_enable_revision=}"
          if [ -z "${maintenance_revision}" ] || [ "${maintenance_revision}" = "${maintenance_output}" ]; then
            echo "::error::Enabled maintenance revision could not be determined"
            exit 1
          fi
          echo "revision=${maintenance_revision}" >> "${GITHUB_OUTPUT}"

      - name: Verify test database connections are drained
        if: ${{ inputs.dry_run == 'false' && inputs.sync_scope == 'full' }}
        shell: bash
        env:
          TEST_DB_DIRECT_URL: ${{ secrets.TEST_DB_DIRECT_URL }}
          DB_NAME_PROD: ${{ vars.PROD_DB_NAME }}
          DB_NAME_TEST: ${{ vars.TEST_DB_NAME }}
          DB_CONNECT_TIMEOUT: "10"
        run: |
          set -euo pipefail
          python scripts/check_test_db_connections_drained.py

      - name: Synchronize approved production database tables to test
        if: ${{ inputs.dry_run == 'false' && inputs.sync_scope == 'full' }}
        shell: bash
        env:
          PROD_DB_DIRECT_URL: ${{ secrets.PROD_DB_DIRECT_URL }}
          TEST_DB_DIRECT_URL: ${{ secrets.TEST_DB_DIRECT_URL }}
          DB_NAME_PROD: ${{ vars.PROD_DB_NAME }}
          DB_NAME_TEST: ${{ vars.TEST_DB_NAME }}
          DB_CONNECT_TIMEOUT: "10"
        run: |
          set -euo pipefail
          python scripts/sync_prod_to_test_db.py

      - name: Validate existing test maintenance revision for GCS resume
        if: ${{ inputs.dry_run == 'false' && inputs.sync_scope == 'gcs_only' }}
        shell: bash
        env:
          EXPECTED_TEST_REVISION: ${{ inputs.expected_test_revision }}
          MAINTENANCE_CONFIRMATION: ${{ inputs.maintenance_confirmation }}
        run: |
          set -euo pipefail
          if [ "${MAINTENANCE_CONFIRMATION}" != "kanade-orchestra/asia-northeast2/kanade-orchestra-test" ]; then
            echo "::error::Maintenance confirmation does not exactly match the test target."
            exit 1
          fi
          service_json="$(gcloud run services describe "kanade-orchestra-test" \
            --project "kanade-orchestra" \
            --region "asia-northeast2" \
            --format=json)"
          export SERVICE_JSON="${service_json}"
          python - <<'PY'
          import json
          import os
          import sys

          service = json.loads(os.environ["SERVICE_JSON"])
          expected = os.environ["EXPECTED_TEST_REVISION"]
          current = service.get("status", {}).get("latestReadyRevisionName")
          traffic = service.get("status", {}).get("traffic", [])
          containers = service.get("spec", {}).get("template", {}).get("spec", {}).get("containers", [])
          env = containers[0].get("env", []) if len(containers) == 1 else []
          maintenance = [
              item.get("value")
              for item in env
              if item.get("name") == "MAINTENANCE_MODE" and "valueFrom" not in item
          ]
          if not expected or current != expected:
              sys.exit("Current ready revision does not match the approved maintenance revision")
          if len(traffic) != 1 or traffic[0].get("revisionName") != expected or traffic[0].get("percent") != 100:
              sys.exit("Traffic is not 100% assigned to the approved maintenance revision")
          if maintenance != ["true"]:
              sys.exit("Test service is not in maintenance mode")
          PY

      - name: Synchronize approved production GCS objects to test
        if: ${{ inputs.dry_run == 'false' }}
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCS_BUCKET_PROD: ${{ vars.PROD_GCS_BUCKET }}
          GCS_BUCKET_TEST: ${{ vars.TEST_GCS_BUCKET }}
        run: |
          set -euo pipefail
          python -m scripts.sync_prod_to_test_gcs --execute

      - name: Disable test maintenance after successful synchronization
        if: ${{ inputs.dry_run == 'false' && success() }}
        shell: bash
        env:
          ENABLED_MAINTENANCE_REVISION: ${{ inputs.sync_scope == 'gcs_only' && inputs.expected_test_revision || steps.enable_maintenance.outputs.revision }}
          MAINTENANCE_CONFIRMATION: ${{ inputs.maintenance_confirmation }}
        run: |
          set -euo pipefail
          python scripts/manage_test_maintenance.py disable \
            --project "kanade-orchestra" \
            --region "asia-northeast2" \
            --service "kanade-orchestra-test" \
            --confirmation "${MAINTENANCE_CONFIRMATION}" \
            --expected-revision "${ENABLED_MAINTENANCE_REVISION}" \
            --execute

      - name: Sync direction policy note
        shell: bash
        env:
          OPERATION_ID: ${{ inputs.operation_id }}
          TARGET_GIT_SHA: ${{ inputs.target_git_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "operation_id=${OPERATION_ID}"
          echo "target_git_sha=${TARGET_GIT_SHA}"
          echo "dry_run=${DRY_RUN}"
          echo "Allowed direction only: production -> test"
          echo "Reverse sync (test -> production) must not be implemented."

      - name: Integrated synchronization completed
        shell: bash
        run: |
          echo "Production-to-test synchronization workflow completed."
