<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奏オケポータル</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">奏オケポータル</a>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-success" id="portalReloadBtn" type="button">リロード</button>
                <button class="btn btn-outline-primary" id="adminMenuBtn" type="button">管理メニュー</button>
                <button class="btn btn-outline-secondary" id="memberMenuBtn" type="button">団員メニュー</button>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4">
        <section id="adminPanel" class="panel">
            <div class="toolbar mb-3">
                <button class="btn btn-sm btn-outline-primary active" data-tab="upload" type="button">録音管理</button>
                <button class="btn btn-sm btn-outline-primary" data-tab="performance" type="button">演奏会情報</button>
                <button class="btn btn-sm btn-outline-primary" data-tab="schedule" type="button">練習予定</button>
                <button class="btn btn-sm btn-outline-primary" data-tab="announcement" type="button">お知らせ</button>
            </div>

            <div id="adminProgressArea" class="admin-progress-area mb-3" hidden>
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <strong id="adminProgressTitle">処理中</strong>
                    <span id="adminProgressPercent" class="small text-muted">0%</span>
                </div>
                <div class="progress mb-2" role="progressbar" aria-label="管理メニュー処理進捗">
                    <div id="adminProgressBar" class="progress-bar" style="width: 0%"></div>
                </div>
                <div id="adminProgressStatus" class="small text-muted">待機中</div>
            </div>

            <div id="uploadTab" class="tab-content">
                <div class="card">
                    <div class="card-header">録音アップロード</div>
                    <div class="card-body">
                        <div class="row g-3 mb-3">
                            <div class="col-md-3">
                                <label class="form-label" for="uploadDate">練習日</label>
                                <input type="date" id="uploadDate" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="uploadPiece">曲名</label>
                                <input type="text" id="uploadPiece" class="form-control" placeholder="例: 交響曲第5番 第1楽章">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="bitrate">変換品質</label>
                                <select id="bitrate" class="form-select">
                                    <option value="128">128 kbps</option>
                                    <option value="192" selected>192 kbps</option>
                                    <option value="320">320 kbps</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <button class="btn btn-outline-primary" id="selectFileBtn" type="button">ファイルを選択</button>
                            <small id="selectedFileName" class="text-muted ms-2">未選択</small>
                            <input type="file" id="fileInput" accept=".wav,.mp3,audio/wav,audio/mpeg" multiple hidden>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <button class="btn btn-primary" id="uploadBtn" type="button">録音ファイルを保存</button>
                            <button class="btn btn-outline-danger" id="clearBtn" type="button">クリア</button>
                        </div>

                        <div id="uploadProgressArea" class="upload-progress-area mt-3" hidden>
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <strong id="uploadProgressTitle">アップロード準備中</strong>
                                <span id="uploadProgressPercent" class="small text-muted">0%</span>
                            </div>
                            <div class="progress mb-2" role="progressbar" aria-label="録音ファイル取り込み進捗">
                                <div id="uploadProgressBar" class="progress-bar" style="width: 0%"></div>
                            </div>
                            <div id="uploadProgressStatus" class="small text-muted mb-2">待機中</div>
                            <ul id="uploadProgressList" class="upload-progress-list small mb-0"></ul>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">録音ファイル一覧</div>
                    <div class="card-body">
                        <div id="songTreeAdmin"></div>
                    </div>
                </div>
            </div>

            <div id="performanceTab" class="tab-content" hidden>
                <div class="card">
                    <div class="card-header">演奏会情報管理</div>
                    <div class="card-body">
                        <input type="hidden" id="perfId">
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label" for="perfTitle">タイトル</label>
                                <input type="text" class="form-control" id="perfTitle">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label" for="perfDate">開催日</label>
                                <input type="date" class="form-control" id="perfDate">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label" for="perfOpenTime">開場</label>
                                <input type="time" class="form-control" id="perfOpenTime" value="18:00">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label" for="perfStartTime">開演</label>
                                <input type="time" class="form-control" id="perfStartTime" value="19:00">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label" for="perfConductor">指揮</label>
                                <input type="text" class="form-control" id="perfConductor">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="perfVenue">会場</label>
                                <input type="text" class="form-control" id="perfVenue">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="perfPieceComposer">作曲者</label>
                                <input type="text" class="form-control" id="perfPieceComposer" placeholder="例: サン＝サーンス">
                            </div>
                            <div class="col-md-5">
                                <label class="form-label" for="perfPieceTitle">曲名</label>
                                <input type="text" class="form-control" id="perfPieceTitle" placeholder="例: 交響曲第3番 オルガン付き">
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button class="btn btn-outline-primary w-100" id="addPieceBtn" type="button">曲を追加</button>
                            </div>
                            <div class="col-12">
                                <ul class="list-group" id="perfPieceList"></ul>
                            </div>
                        </div>
                        <div class="d-flex flex-wrap gap-2 mb-3">
                            <button class="btn btn-success" id="addPerfBtn" type="button">保存</button>
                            <button class="btn btn-outline-secondary" id="editPerfBtn" type="button">選択解除</button>
                            <button class="btn btn-danger" id="deletePerfBtn" type="button">削除</button>
                        </div>
                        <ul class="list-group" id="perfListItems"></ul>
                    </div>
                </div>
            </div>

            <div id="scheduleTab" class="tab-content" hidden>
                <div class="card">
                    <div class="card-header">練習予定管理</div>
                    <div class="card-body">
                        <input type="hidden" id="schedId">
                        <div class="row g-3 mb-3">
                            <div class="col-md-2">
                                <label class="form-label" for="schedDate">練習日</label>
                                <input type="date" class="form-control" id="schedDate">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label" for="schedStartTime">開始時間</label>
                                <input type="time" class="form-control" id="schedStartTime" value="13:00">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label" for="schedEndTime">終了時間</label>
                                <input type="time" class="form-control" id="schedEndTime" value="16:30">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="schedVenue">場所</label>
                                <input type="text" class="form-control" id="schedVenue">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label" for="schedAvailableStartTime">利用可能開始</label>
                                <input type="time" class="form-control" id="schedAvailableStartTime" value="12:30">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label" for="schedAvailableEndTime">利用可能終了</label>
                                <input type="time" class="form-control" id="schedAvailableEndTime" value="16:30">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="schedPieces">練習曲</label>
                                <input type="text" class="form-control" id="schedPieces">
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" id="schedConductorTraining">
                                    <label class="form-check-label fw-bold" for="schedConductorTraining">指揮トレ</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="schedNotes">備考</label>
                                <textarea class="form-control" id="schedNotes" rows="3" placeholder="備考を複数行で入力できます"></textarea>
                            </div>
                        </div>
                        <div class="d-flex flex-wrap gap-2 mb-3">
                            <button class="btn btn-success" id="addSchedBtn" type="button">保存</button>
                            <button class="btn btn-outline-secondary" id="editSchedBtn" type="button">選択解除</button>
                            <button class="btn btn-danger" id="deleteSchedBtn" type="button">削除</button>
                        </div>
                        <div id="schedListItems"></div>
                    </div>
                </div>
            </div>

            <div id="announcementTab" class="tab-content" hidden>
                <div class="card">
                    <div class="card-header">お知らせ管理</div>
                    <div class="card-body">
                        <input type="hidden" id="annId">
                        <div class="row g-3 mb-3">
                            <div class="col-md-3">
                                <label class="form-label" for="annDate">日付</label>
                                <input type="date" class="form-control" id="annDate">
                            </div>
                            <div class="col-md-9">
                                <label class="form-label" for="annContent">内容</label>
                                <textarea class="form-control" id="annContent" rows="2"></textarea>
                            </div>
                        </div>
                        <div class="d-flex flex-wrap gap-2 mb-3">
                            <button class="btn btn-success" id="addAnnBtn" type="button">保存</button>
                            <button class="btn btn-outline-secondary" id="editAnnBtn" type="button">選択解除</button>
                            <button class="btn btn-danger" id="deleteAnnBtn" type="button">削除</button>
                        </div>
                        <ul class="list-group" id="annListItems"></ul>
                    </div>
                </div>
            </div>
        </section>

        <section id="memberPanel" class="panel" hidden>
            <div class="toolbar mb-3">
                <button class="btn btn-sm btn-outline-secondary active" data-tab="member-announce" type="button">お知らせ</button>
                <button class="btn btn-sm btn-outline-secondary" data-tab="member-performance" type="button">演奏会情報</button>
                <button class="btn btn-sm btn-outline-secondary" data-tab="member-schedule" type="button">練習予定</button>
                <button class="btn btn-sm btn-outline-secondary" data-tab="member-recording" type="button">録音部屋</button>
                <button class="btn btn-sm btn-outline-secondary" data-tab="member-sns" type="button">SNS</button>
                <button class="btn btn-sm btn-outline-secondary" data-tab="member-concert-records" type="button">演奏会記録</button>
            </div>

            <div id="memberAnnounceTab" class="tab-content">
                <div class="card">
                    <div class="card-header">お知らせ</div>
                    <div class="card-body">
                        <ul class="list-group" id="memberAnnList"></ul>
                    </div>
                </div>
            </div>

            <div id="memberPerformanceTab" class="tab-content" hidden>
                <div class="card">
                    <div class="card-header">演奏会情報</div>
                    <div class="card-body" id="memberPerfInfo"></div>
                </div>
            </div>

            <div id="memberScheduleTab" class="tab-content" hidden>
                <div class="card">
                    <div class="card-header">練習予定</div>
                    <div class="card-body" id="memberSchedInfo"></div>
                </div>
            </div>

            <div id="memberRecordingTab" class="tab-content" hidden>
                <div class="card">
                    <div class="card-header">録音部屋</div>
                    <div class="card-body" id="songTreeMember"></div>
                </div>
            </div>

            <div id="memberSnsTab" class="tab-content" hidden>
                <div class="card">
                    <div class="card-header">SNS</div>
                    <div class="card-body" id="memberSnsInfo"></div>
                </div>
            </div>

            <div id="memberConcertRecordsTab" class="tab-content" hidden>
                <div class="card">
                    <div class="card-header">演奏会記録</div>
                    <div class="card-body" id="memberConcertRecordsInfo"></div>
                </div>
            </div>
        </section>
    </main>

    <div id="toastArea" class="toast-area"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
