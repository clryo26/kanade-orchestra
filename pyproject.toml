[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestra-management-tool"
version = "1.0.0"
description = "オーケストラ活動管理ツール - Webアプリケーション"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Orchestra Team"}
]

dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "pydantic==2.5.0",
    "python-multipart==0.0.6",
    "pydub==0.25.1",
    "imageio-ffmpeg==0.4.9",
    "setuptools==69.0.3",
    "librosa==0.10.0",
    "google-cloud-storage==2.14.0",
    "google-auth==2.25.2",
    "python-dotenv==1.0.0",
    "psycopg[binary]==3.2.9",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "black==23.12.0",
    "ruff==0.1.9",
    "mypy==1.7.1",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "httpx==0.24.1",
]


[tool.pytest.ini_options]
markers = [
    "db_profile: tests that validate the database-mode repository and API contracts",
]
